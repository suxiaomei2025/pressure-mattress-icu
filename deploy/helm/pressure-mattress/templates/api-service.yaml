apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pressure-mattress.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pressure-mattress.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
