{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pressure-mattress.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.backup.storage.size }}
  {{- if .Values.backup.storage.storageClassName }}
  storageClassName: {{ .Values.backup.storage.storageClassName }}
  {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pressure-mattress.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  stamp="$(date +%Y%m%d-%H%M%S)"
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -h db -U "$POSTGRES_USER" -d "$POSTGRES_DB" -F c -f "/backups/pressure-mattress-$stamp.dump"
                  find /backups -name '*.dump' -mtime +{{ .Values.backup.retentionDays }} -delete
                  echo "backup complete: /backups/pressure-mattress-$stamp.dump"
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    configMapKeyRef:
                      name: pm-config
                      key: POSTGRES_USER
                - name: POSTGRES_DB
                  valueFrom:
                    configMapKeyRef:
                      name: pm-config
                      key: POSTGRES_DB
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pm-secrets
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backup
                  mountPath: /backups
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: db-backup
{{- end }}
